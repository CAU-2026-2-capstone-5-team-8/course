<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data: https://tile.openstreetmap.org; connect-src https://routing.openstreetmap.de; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="leaflet.css">
<title>SnapSpot 코스</title>
<style>
  :root { --ink:#191F28; --ink2:#4E5968; --muted:#6B7684; --line:#E5E8EB; --bg:#F2F4F6; --card:#fff; --lime:#D9F99D; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; letter-spacing:-.3px; }
  main { max-width:520px; margin:0 auto; padding:28px 16px 40px; }
  .kicker { color:var(--ink2); font-size:13px; font-weight:600; margin:0 0 2px 4px; }
  h1 { font-size:24px; line-height:32px; margin:0 0 4px 4px; }
  .sum { color:var(--ink2); margin:0 0 16px 4px; }
  .card { background:var(--card); border-radius:10px; }
  #map { height:320px; border-radius:10px; overflow:hidden; background:#E8ECEF; z-index:0; font:inherit; }
  .leaflet-container { letter-spacing:0; }
  .leaflet-container .leaflet-control-attribution { font-size:10px; padding:0 4px; }
  .leaflet-container .leaflet-control-attribution a { font-size:10px; font-weight:400; color:var(--ink2); }
  .walk { display:block; width:100%; margin-top:8px; padding:13px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; font-weight:700; }
  .walk:disabled { color:var(--muted); }
  .stay { color:var(--muted); font-size:12px; }
  .pin { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--lime); border:3px solid #fff; font-weight:700; font-size:14px; box-shadow:0 1px 4px rgba(0,0,0,.35); }
  .pin.small { width:26px; height:26px; border-width:2px; font-size:12px; }
  .note + .note { margin-top:-12px; }
  .note { color:var(--muted); font-size:12px; margin:8px 4px 20px; }
  ol { list-style:none; margin:0; padding:0; }
  .stop { display:flex; gap:12px; padding:14px; }
  .num { flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--lime); font-weight:700; font-size:14px; display:grid; place-items:center; }
  .body { flex:1; min-width:0; }
  .name { font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .when { flex:none; text-align:right; }
  .time { color:var(--ink2); font-weight:600; font-size:13px; white-space:nowrap; }
  .meal { display:inline-block; margin-top:4px; padding:3px 8px; border-radius:8px; background:var(--bg); font-size:12px; font-weight:700; white-space:nowrap; }
  .why { color:var(--ink2); font-size:13px; margin-top:4px; }
  a { color:var(--ink); font-weight:600; font-size:14px; text-underline-offset:3px; }
  .map-link { display:inline-block; padding:6px 0; }
  .leg { padding:4px 0 4px 27px; }
  .leg a { display:block; border-left:2px solid var(--line); padding:8px 0 8px 26px; color:var(--ink2); font-size:13px; }
  .open { display:block; text-align:center; background:var(--ink); color:#fff; border-radius:10px; padding:16px; margin-top:24px; text-decoration:none; font-size:15px; }
  .last { margin-top:20px; }
  :focus-visible { outline:3px solid #65A30D; outline-offset:2px; }
</style>
</head>
<body>
<main id="app"><p class="note">불러오는 중이에요.</p><noscript>이 페이지는 자바스크립트가 켜져 있어야 보여요.</noscript></main>
<script src="leaflet.js"></script>
<script>
// The places come from the part of the address after '#', which browsers never send to a server.
const MAX = 10, MAX_BYTES = 16 * 1024;
const MEALS = { l: ['점심', '11:30~13:30'], d: ['저녁', '17:30~19:30'] };
const app = document.getElementById('app');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const link = (cls, href, text) => { const a = el('a', cls, text); a.href = href; a.rel = 'noreferrer'; return a; };
const num = (s, lo, hi) => { const n = /^\d{1,4}$/.test(s || '') ? +s : NaN; return n >= lo && n <= hi ? n : null; };

// Version 1 is raw deflate; version 2 carries a checksum, so a changed address is refused instead of shown garbled.
async function unpack(version, b64) {
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(version === '1' ? 'deflate-raw' : 'deflate')).getReader();
  const parts = []; let size = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; size += value.length; if (size > MAX_BYTES) throw new Error('too big'); parts.push(value); }
  return new TextDecoder('utf-8', { fatal: true }).decode(await new Blob(parts).arrayBuffer());
}
// First line: kind, start of the course (HHMM), minutes on foot. Then a line per place:
// name, address, category, lat, lng, radius, end date, Kakao id, minutes after the start, minutes there, meal.
// The last three and the start may be missing (a list of places, or an older code).
function read(body) {
  const lines = body.split('\n'), head = lines[0].split('\t');
  if (head[0] !== 'c' && head[0] !== 'p') throw new Error('kind');
  const places = lines.slice(1, MAX + 1).map(l => {
    const f = l.split('\t'), lat = parseInt(f[3], 10) / 1e5, lng = parseInt(f[4], 10) / 1e5;
    if (f.length < 8 || !f[0] || !(Math.abs(lat) <= 85) || !(Math.abs(lng) <= 180)) return null;
    return { name: f[0].slice(0, 60), address: f[1].slice(0, 100), category: f[2].slice(0, 30), lat, lng,
      end: /^\d{4}-\d{2}-\d{2}$/.test(f[6]) ? f[6] : '', id: /^\d{1,15}$/.test(f[7]) ? f[7] : '',
      after: num(f[8], 0, 1440), stay: num(f[9], 0, 600), meal: /^[ldLD]$/.test(f[10] || '') ? f[10] : '' };
  }).filter(Boolean);
  if (!places.length) throw new Error('empty');
  const hm = /^([01]\d|2[0-3])([0-5]\d)$/.exec(head[1] || ''), course = head[0] === 'c';
  const timed = course && hm && places.every(p => p.after != null && p.stay != null);
  return { course, places, start: timed ? +hm[1] * 60 + +hm[2] : null, walk: course ? num(head[2], 1, 1440) : null };
}
const point = p => encodeURIComponent(p.name.replace(/[\/,]/g, ' ')) + ',' + p.lat + ',' + p.lng;
function clock(min) {
  const m = Math.round(min / 5) * 5 % 1440, h = Math.floor(m / 60);
  return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + String(m % 60).padStart(2, '0');
}
function drawMap(box, places, course) {
  const touch = matchMedia('(pointer: coarse)').matches;
  // One finger scrolls the page; two move the map.
  const map = L.map(box, { dragging: !touch, scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" rel="noreferrer">OpenStreetMap</a> 기여자' }).addTo(map);
  const at = places.map(p => [p.lat, p.lng]), order = [];
  if (course && at.length > 1) {
    order.push(L.polyline(at, { color: '#fff', weight: 7, opacity: .9, interactive: false }).addTo(map));
    order.push(L.polyline(at, { color: '#191F28', weight: 4, dashArray: '2 8', interactive: false }).addTo(map));
  }
  places.forEach((p, i) => {
    const size = places.length > 6 ? 26 : 32, pin = el('div', size < 32 ? 'pin small' : 'pin', i + 1);
    const tip = el('span', '', p.name);
    L.marker(at[i], { icon: L.divIcon({ html: pin, className: '', iconSize: [size, size] }), title: p.name, alt: (i + 1) + '번 ' + p.name, zIndexOffset: (MAX - i) * 10 }).bindPopup(tip).addTo(map);
  });
  if (at.length > 1) map.fitBounds(L.latLngBounds(at), { padding: [36, 36], maxZoom: 17, animate: false }); else map.setView(at[0], 16);
  return { map, order };
}
// Only when asked for: the coordinates of the places go to the routing server.
async function drawWalk({ map, order }, places, button, note) {
  button.disabled = true; button.textContent = '길을 찾는 중이에요';
  try {
    const at = places.map(p => p.lng + ',' + p.lat).join(';');
    const res = await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/' + at + '?overview=full&geometries=geojson', { signal: AbortSignal.timeout(15000) });
    const data = await res.json(), route = data.code === 'Ok' && data.routes[0];
    if (!res.ok || !route) throw new Error('no route');
    const line = route.geometry.coordinates.map(([x, y]) => [y, x]);
    order.forEach(l => l.remove());
    L.polyline(line, { color: '#fff', weight: 8, opacity: .9, interactive: false }).addTo(map);
    L.polyline(line, { color: '#191F28', weight: 4, interactive: false }).addTo(map);
    map.attributionControl.addAttribution('길찾기 <a href="https://routing.openstreetmap.de/about.html" rel="noreferrer">FOSSGIS</a> · <a href="https://www.openstreetmap.org/fixthemap" rel="noreferrer">지도 고치기</a>');
    map.fitBounds(L.latLngBounds(line), { padding: [36, 36], maxZoom: 17 });
    note.textContent = `OpenStreetMap 길찾기로 이은 길이에요. 약 ${(route.distance / 1000).toFixed(1)}km, 걸어서 ${Math.round(route.duration / 60)}분이에요. 앱이 어림한 시간과 다를 수 있어요.`;
    button.remove();
  } catch (e) {
    button.disabled = false; button.textContent = '다시 시도하기';
    note.textContent = '걷는 길을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';
  }
}
function show({ course, places, start, walk }, packed) {
  app.replaceChildren();
  app.append(el('p', 'kicker', 'SnapSpot으로 공유받았어요'), el('h1', '', course ? `${places.length}곳을 도는 코스` : `장소 ${places.length}곳`));
  const last = places[places.length - 1], sum = [];
  if (walk) sum.push(`걸어서 ${walk}분`);
  if (start != null) sum.push(`${clock(start)} 시작 · ${clock(start + last.after + last.stay)}쯤 끝`);
  app.append(el('p', 'sum', sum.join(' · ')));
  const box = el('div'); box.id = 'map'; app.append(box);
  const canWalk = course && places.length > 1, button = el('button', 'walk', '실제 걷는 길 그리기'), note = el('p', 'note');
  button.type = 'button';
  if (canWalk) app.append(button);
  note.setAttribute('aria-live', 'polite');
  note.textContent = canWalk ? '점선은 방문 순서예요. 걷는 길을 그리면 장소의 좌표가 OpenStreetMap 길찾기 서버로 보내져요.' : '두 손가락으로 지도를 움직일 수 있어요.';
  app.append(note);
  if (start != null) app.append(el('p', 'note', '시각과 머무는 시간은 보낸 사람이 공유할 때 어림한 값이에요.'));
  const ol = el('ol', 'card');
  places.forEach((p, i) => {
    const li = el('li'), row = el('div', 'stop'), body = el('div', 'body'), meal = start != null && p.meal ? MEALS[p.meal.toLowerCase()] : null;
    body.append(el('div', 'name', p.name), el('div', 'meta', [p.category, p.address].filter(Boolean).join(' · ')));
    if (p.end) body.append(el('div', 'meta', p.end + '까지'));
    if (meal && p.meal === p.meal.toUpperCase()) body.append(el('div', 'why', `${meal[0]} 시간(${meal[1]})에 도착하도록 순서를 조정했어요. 가장 짧은 순서와는 달라요.`));
    body.append(link('map-link', p.id ? 'https://place.map.kakao.com/' + p.id : 'https://map.kakao.com/link/map/' + point(p), '카카오맵에서 보기'));
    row.append(el('div', 'num', i + 1), body);
    if (start != null) { const w = el('div', 'when'); w.append(el('div', 'time', clock(start + p.after) + '쯤')); if (p.stay) w.append(el('div', 'stay', `${p.stay}분 머묾`)); if (meal) w.append(el('div', 'meal', meal[0] + ' 시간')); row.append(w); }
    li.append(row);
    if (course && places[i + 1]) { const leg = el('div', 'leg'); leg.append(link('', 'https://map.kakao.com/link/by/walk/' + point(p) + '/' + point(places[i + 1]), `${i + 2}번까지 걷는 길 보기`)); li.append(leg); }
    ol.append(li);
  });
  app.append(ol);
  // SnapSpot is an Android app: elsewhere the link would only show an error.
  if (/Android/i.test(navigator.userAgent)) app.append(link('open', 'snapspot://import?' + packed, 'SnapSpot에서 열기'));
  app.append(el('p', 'note last', 'SnapSpot은 저장한 장소 근처를 지날 때 알려 주는 안드로이드 앱이에요. 앱이 있으면 이 QR을 앱에서 찍어 장소를 저장할 수 있어요. 장소 목록은 QR에 담겨 있고 서버로 보내거나 저장하지 않아요. 지도 그림은 OpenStreetMap에서 가져와서, 어느 동네를 보는지는 그쪽에서 알 수 있어요.'));
  const drawn = drawMap(box, places, course);
  if (canWalk) button.onclick = () => drawWalk(drawn, places, button, note);
}
async function start() {
  try {
    if (typeof DecompressionStream === 'undefined') throw new Error('old browser');
    const m = /^#([12])\.([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (!m) throw new Error('no data');
    show(read(await unpack(m[1], m[2])), 'v=' + m[1] + '&d=' + m[2]);
  } catch (e) {
    const old = e.message === 'old browser';
    app.replaceChildren(el('h1', '', '코스를 읽지 못했어요'), el('p', 'note', old ? '브라우저가 오래돼서 보여 드릴 수 없어요. 업데이트한 뒤 다시 열어 주세요.' : 'QR이 잘렸거나 주소가 바뀐 것 같아요. 다시 찍어 보세요.'));
  }
}
addEventListener('hashchange', start);
start();
</script>
</body>
</html>
